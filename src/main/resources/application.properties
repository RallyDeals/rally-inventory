spring.application.name=inventory-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:inventory}
spring.datasource.username=${DB_USER:inventory_user}
spring.datasource.password=${DB_PASSWORD:inventory_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

server.port=8087

# ===================================================================
# Kafka Observation / Distributed Tracing
# ===================================================================
spring.kafka.listener.observation-enabled=true

# ===================================================================
# Logging
# ===================================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.rally.inventory_service=${LOGGING_LEVEL_RALLY:INFO}
logging.level.org.hibernate=${LOGGING_LEVEL_HIBERNATE:WARN}
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.apache.kafka=${LOGGING_LEVEL_KAFKA:WARN}
logging.level.org.springframework.kafka=${LOGGING_LEVEL_SPRING_KAFKA:WARN}
logging.level.org.springframework=${LOGGING_LEVEL_SPRING:WARN}

# ===================================================================
# Actuator / Metrics / Tracing
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
management.metrics.tags.application=${spring.application.name}

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# W3C baggage: carry X-Correlation-Id across services and surface them in logs (MDC) and spans
management.tracing.baggage.remote-fields=X-Correlation-Id
management.tracing.baggage.correlation.fields=X-Correlation-Id
management.tracing.baggage.tag-fields=X-Correlation-Id